<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sift</title>
    <link rel="stylesheet" href="./styles/popup.css" />
  </head>
  <body>
    <main class="popup-shell">
      <header class="popup-header">
        <img class="brand-mark" src="./assets/sift-logo-64.png" alt="Sift logo" />
        <div>
          <h1>Sift</h1>
          <p id="domain">Detecting page...</p>
        </div>
      </header>

      <section class="status-card" aria-live="polite">
        <span id="connection-dot" class="dot"></span>
        <span id="connection">Checking dashboard...</span>
      </section>

      <section class="popup-actions">
        <button id="get-data" class="primary-action" type="button">Get Data</button>
        <button id="open-dashboard" class="secondary-action" type="button">Open Dashboard</button>
      </section>

      <section class="result-card">
        <div class="counts-grid">
          <div>
            <span class="label">Usernames</span>
            <strong id="username-count">0</strong>
          </div>
          <div>
            <span class="label">Display names</span>
            <strong id="name-count">0</strong>
          </div>
        </div>
        <progress id="progress" max="100" value="0"></progress>
      </section>

      <p id="notice" class="notice" aria-live="polite"></p>
      <p class="powered-by">Powered by Roldan Creations</p>
    </main>
    <script type="module" src="./popup.ts"></script>
  </body>
</html>
